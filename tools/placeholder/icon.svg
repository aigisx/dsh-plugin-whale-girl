<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>Whale girl</title>
  <defs>
    <linearGradient id="wg-body" x1="14" y1="20" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8E1FF"/>
      <stop offset="1" stop-color="#3E76F0"/>
    </linearGradient>
    <linearGradient id="wg-tail" x1="9" y1="5" x2="38" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CDEEFF"/>
      <stop offset="1" stop-color="#5B8DFF"/>
    </linearGradient>
    <linearGradient id="wg-bow" x1="43" y1="13" x2="60" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB4CB"/>
      <stop offset="1" stop-color="#FF6E9C"/>
    </linearGradient>
  </defs>

  <!-- tail fluke, behind the body -->
  <path d="M25.5 27.5C18.5 25 10.5 17 9 6.5c8 2.5 15 9 19.5 16.5Z" fill="url(#wg-tail)"/>
  <path d="M28 26.5C29.5 18 33 10 38.5 5.5c.5 8-2.7 15.6-7.6 20.6Z" fill="url(#wg-tail)"/>

  <!-- body -->
  <ellipse cx="33" cy="39" rx="21" ry="18" fill="url(#wg-body)"/>

  <!-- belly -->
  <ellipse cx="33" cy="48.5" rx="14" ry="8" fill="#FFFFFF" opacity="0.82"/>

  <!-- left flipper -->
  <path d="M14.5 39.5c-4.7.6-8.8 4.1-9.9 8.8 4.7-.4 9.2-2.7 12.1-6Z" fill="#6C9BFF"/>

  <!-- eyes -->
  <ellipse cx="25.5" cy="37" rx="2.7" ry="3.6" fill="#12203A"/>
  <ellipse cx="40.5" cy="37" rx="2.7" ry="3.6" fill="#12203A"/>
  <circle cx="26.6" cy="35.7" r="1.05" fill="#FFFFFF"/>
  <circle cx="41.6" cy="35.7" r="1.05" fill="#FFFFFF"/>

  <!-- blush -->
  <ellipse cx="19.5" cy="43" rx="4" ry="2.4" fill="#FF8FB0" opacity="0.6"/>
  <ellipse cx="46.5" cy="43" rx="4" ry="2.4" fill="#FF8FB0" opacity="0.6"/>

  <!-- smile -->
  <path d="M29.5 43.5c2 2.4 5 2.4 7 0" stroke="#12203A" stroke-width="1.7" stroke-linecap="round"/>

  <!-- bow -->
  <path d="M49.4 20.9 43.6 14.4c-1.5 2.9-1.5 6.4.2 9.1Z" fill="url(#wg-bow)"/>
  <path d="M51.4 20.6 57.6 13.4c1 3.1.4 6.6-1.7 9Z" fill="url(#wg-bow)"/>
  <circle cx="50.6" cy="21.9" r="2.4" fill="#FF9BB8"/>
</svg>
